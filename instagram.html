<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Colorful · Instagram</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
</head>
<body>

    <div class="colorful-bg">
        <div class="rainbow-mesh"></div>
        <div class="color-wave"></div>
        <div class="color-orb c1"></div>
        <div class="color-orb c2"></div>
        <div class="color-orb c3"></div>
        <div class="color-orb c4"></div>
        <div class="color-orb c5"></div>
        <div class="color-orb c6"></div>
        <div class="color-orb c7"></div>
        <div class="color-orb c8"></div>
        <div class="particles"></div>
    </div>

    <div class="apple-container">
        <div class="apple-card colorful-card">

            <div class="apple-status">
                <div class="apple-status-left">
                    <span class="apple-dot rainbow"></span>
                    <span class="apple-status-text" style="color:rgba(255,255,255,0.6);">Live</span>
                    <span class="apple-divider" style="color:rgba(255,255,255,0.1);">|</span>
                    <span class="apple-status-step" style="color:rgba(255,255,255,0.4);">Step 4/5</span>
                </div>
                <div class="apple-status-right">
                    <span class="apple-badge glass">✨ Secure</span>
                    <span class="apple-badge glass purple">🔥 2026</span>
                </div>
            </div>

            <div class="apple-header">
                <div class="apple-logo">
                    <div class="apple-icon gradient-icon">
                        <i class="fas fa-comment-dots"></i>
                    </div>
                    <div>
                        <span class="apple-title" style="color:#fff;">Secret<span style="background:linear-gradient(135deg,#f472b6,#8b5cf6,#06b6d4,#f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Message</span></span>
                        <span class="apple-sub" style="color:rgba(255,255,255,0.3);">anonymous · encrypted</span>
                    </div>
                </div>
                <div class="apple-step-ring">
                    <svg width="40" height="40" viewBox="0 0 40 40">
                        <circle cx="20" cy="20" r="16" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2.5"/>
                        <circle cx="20" cy="20" r="16" fill="none" stroke="url(#rainbowGrad)" stroke-width="2.5" stroke-dasharray="100" stroke-dashoffset="20"/>
                        <defs>
                            <linearGradient id="rainbowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#f472b6"/>
                                <stop offset="33%" stop-color="#8b5cf6"/>
                                <stop offset="66%" stop-color="#06b6d4"/>
                                <stop offset="100%" stop-color="#f59e0b"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <span class="apple-step-num" style="color:#fff;">4</span>
                </div>
            </div>

            <div class="apple-progress">
                <div class="apple-progress-track" style="background:rgba(255,255,255,0.06);">
                    <div class="apple-progress-fill rainbow-fill" style="width:80%"></div>
                </div>
                <div class="apple-dots">
                    <span class="apple-dot-item done" style="color:rgba(255,255,255,0.3);">Name</span>
                    <span class="apple-dot-item done" style="color:rgba(255,255,255,0.3);">Age</span>
                    <span class="apple-dot-item done" style="color:rgba(255,255,255,0.3);">City</span>
                    <span class="apple-dot-item active" style="color:#f472b6;">IG</span>
                    <span class="apple-dot-item" style="color:rgba(255,255,255,0.2);">Message</span>
                </div>
            </div>

            <form id="instagramForm">
                <div class="apple-step">
                    <div class="apple-step-icon" style="background:linear-gradient(135deg,#f472b6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">
                        <i class="fab fa-instagram"></i>
                    </div>
                    <h2 class="apple-title-lg" style="color:#fff;">Your <span style="background:linear-gradient(135deg,#f472b6,#8b5cf6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">Instagram</span> ID?</h2>
                    <p class="apple-desc" style="color:rgba(255,255,255,0.3);">📸 So I can connect with you</p>
                    <div class="apple-input-wrap">
                        <div class="apple-input glass-input">
                            <i class="fab fa-instagram" style="color:rgba(255,255,255,0.2);"></i>
