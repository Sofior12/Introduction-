<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Style</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="instagram-card">
            <div class="profile">
                <div class="avatar">✨</div>
                <div class="username">
                    secret_messages <span>• 2h</span>
                </div>
            </div>

            <div class="story-highlight">
                <div class="story-ring" data-msg="💖 You are loved!">
                    <div class="inner">❤️</div>
                </div>
                <div class="story-ring" data-msg="🌟 Keep shining!">
                    <div class="inner">⭐</div>
                </div>
                <div class="story-ring" data-msg="🌈 Stay colorful!">
                    <div class="inner">🌈</div>
                </div>
                <div class="story-ring" data-msg="🔥 You're on fire!">
                    <div class="inner">🔥</div>
                </div>
                <div class="story-ring" data-msg="💪 You got this!">
                    <div class="inner">💪</div>
                </div>
            </div>

            <div class="message-box">
                <div class="msg" id="instaMessage">👆 Tap a story ring above</div>
            </div>

            <div style="margin-top:18px;text-align:center;color:#a8a6d6;font-size:0.85rem;">
                <span>❤️ 1,234</span> · <span>💬 89</span> · <span>📤 45</span>
            </div>

            <a href="index.html" class="back-link" style="display:block;text-align:center;margin-top:18px;">← Back to Home</a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
