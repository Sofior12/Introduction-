<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitHub · Telegram Bot Notify</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="card">
        <!-- GitHub Header -->
        <div class="github-header">
            <i class="fab fa-github"></i>
            <h1>github.com/Sofior12/li <span>webhook</span></h1>
        </div>

        <div class="repo-badge">
            <i class="fas fa-code-branch"></i> main · <i class="fas fa-issue"></i> issues · <i class="fas fa-pull-request"></i> PR
        </div>

        <!-- Introduction (owner) -->
        <div class="intro-section">
            <div class="avatar-row">
                <div class="avatar">
                    <i class="fas fa-user-astronaut"></i>
                </div>
                <div class="intro-text">
                    <h3>Sofior <span style="color: #8b949e; font-weight: 400;">/ li</span></h3>
                    <p><i class="fas fa-code" style="color: #58a6ff;"></i> full-stack · ui/ux</p>
                </div>
            </div>
        </div>

        <!-- Share Link (dusra admi ka intro) -->
        <div class="link-section">
            <label><i class="fas fa-link" style="margin-right: 6px;"></i> share introduction link</label>
            <div class="link-input-wrapper">
                <input type="url" id="linkInput" placeholder="https://your-intro-page.com" value="https://github.com/Sofior12" />
                <button id="shareLinkBtn" class="github-btn"><i class="fab fa-github"></i> share via bot</button>
            </div>
            <div style="font-size: 0.7rem; color: #484f58; margin-top: 0.4rem; text-align: center;">
                <i class="fas fa-info-circle"></i> link will be sent via Telegram Bot API
            </div>
        </div>

        <!-- Contact Form -->
        <div class="form-header">
            <i class="fas fa-paper-plane"></i>
            <h2>send notification <span>bot</span></h2>
        </div>

        <form id="contactForm">
            <div class="input-group">
                <label><i class="far fa-calendar-alt" style="margin-right: 4px;"></i> Age</label>
                <div class="input-field">
                    <i class="fas fa-user"></i>
                    <input type="number" id="ageInput" placeholder="Enter your age" min="1" max="120" value="24" />
                </div>
            </div>

            <div class="row-duo">
                <div class="input-group">
                    <label><i class="fab fa-telegram-plane" style="margin-right: 4px;"></i> Telegram</label>
                    <div class="input-field">
                        <span class="prefix">@</span>
                        <input type="text" id="telegramInput" placeholder="username" value="sofior_dev" />
                    </div>
                </div>
                <div class="input-group">
                    <label><i class="fab fa-instagram" style="margin-right: 4px;"></i> Instagram</label>
                    <div class="input-field">
                        <span class="prefix">@</span>
                        <input type="text" id="instagramInput" placeholder="username" value="sofior.ux" />
                    </div>
                </div>
            </div>

            <div class="input-group msg-field">
                <label><i class="far fa-comment-dots"></i> Message</label>
                <div class="input-field">
                    <i class="far fa-envelope" style="align-self: flex-start; margin-top: 0.15rem;"></i>
                    <textarea id="messageInput" placeholder="Write your message..." rows="2">hey, check my intro! 🚀</textarea>
                </div>
            </div>

            <div class="notify-row">
                <div class="live-label">
                    <span class="live-dot"></span> live
                </div>
                <div style="display: flex; align-items: center; gap: 0.5rem;">
                    <i class="fas fa-robot" style="color: #8b949e;"></i>
                    <span class="badge" id="notifyBadge"><i class="fas fa-paper-plane" style="margin-right: 4px;"></i> bot API</span>
                </div>
            </div>

            <div class="bot-status">
                <span class="bot-dot"></span> <i class="fas fa-check-circle" style="color: #3fb950;"></i> Telegram Bot · ready
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="fas fa-paper-plane"></i> send to bot
            </button>

            <div class="footnote">
                <span><i class="fas fa-code-branch"></i> github.com/Sofior12/li</span>
                <span><i class="fas fa-issue"></i> issues · PR</span>
                <span><i class="fas fa-file-alt"></i> README</span>
            </div>
        </form>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
