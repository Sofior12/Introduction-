<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Telegram Bot · Live Notify</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #f6f9fc 0%, #eef2f7 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .card {
            max-width: 560px;
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(4px);
            border-radius: 2.5rem;
            box-shadow: 0 20px 40px -12px rgba(0, 20, 40, 0.25), 0 8px 24px -8px rgba(0, 0, 0, 0.08);
            padding: 2rem 2rem 2.2rem;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.2s ease;
        }

        .form-header {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.8rem;
        }

        .form-header i {
            font-size: 1.8rem;
            color: #1e293b;
            background: #d9e2ef;
            padding: 0.6rem;
            border-radius: 1.2rem;
        }

        .form-header h2 {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            color: #0b1a2e;
        }

        .form-header span {
            background: #1e293b;
            color: white;
            font-size: 0.7rem;
            font-weight: 500;
            padding: 0.2rem 0.7rem;
            border-radius: 40px;
            margin-left: 0.3rem;
        }

        .input-group {
            margin-bottom: 1.4rem;
        }

        .input-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            color: #334155;
            margin-bottom: 0.3rem;
        }

        .input-field {
            width: 100%;
            background: white;
            border: 1px solid #dbe0e8;
            border-radius: 60px;
            padding: 0.75rem 1.4rem;
            font-size: 0.95rem;
            color: #0b1a2e;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .input-field i {
            color: #6b7a8f;
            font-size: 1rem;
            width: 1.4rem;
            text-align: center;
        }

        .input-field input,
        .input-field textarea {
            border: none;
            outline: none;
            background: transparent;
            width: 100%;
            font-size: 0.95rem;
            color: #0b1a2e;
            resize: vertical;
            font-family: inherit;
        }

        .input-field textarea {
            min-height: 70px;
            padding: 0.3rem 0;
            line-height: 1.5;
        }

        .input-field:focus-within {
            border-color: #1e293b;
            box-shadow: 0 0 0 3px rgba(30, 41, 59, 0.08);
            background: #ffffff;
        }

        .input-field .prefix {
            color: #5f6f84;
            font-weight: 450;
            font-size: 0.9rem;
        }

        .row-duo {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .row-duo .input-group {
            flex: 1 1 0;
            min-width: 140px;
        }

        .msg-field .input-field {
            border-radius: 28px;
            align-items: flex-start;
            padding-top: 0.9rem;
        }

        .notify-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #eef3f9;
            padding: 0.45rem 1.2rem 0.45rem 1.6rem;
            border-radius: 100px;
            margin: 1.8rem 0 1.2rem;
            border: 1px solid #d3dce8;
        }

        .notify-row .badge {
            background: #1e293b;
            color: white;
            font-size: 0.7rem;
            font-weight: 500;
            padding: 0.2rem 0.9rem;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid #3a4c66;
        }

        .notify-row .badge:hover {
            background: #2c405a;
            transform: scale(0.97);
        }

        .notify-row .live-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #22c55e;
            border-radius: 50%;
            margin-right: 6px;
            animation: pulse-dot 1.8s infinite;
        }

        @keyframes pulse-dot {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.5;
                transform: scale(0.9);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        .notify-row .live-label {
            font-weight: 500;
            color: #0f2a40;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
        }

        .btn-submit {
            background: #0b1a2e;
            border: none;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            padding: 0.9rem 1.8rem;
            border-radius: 60px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            transition: 0.2s;
            cursor: pointer;
            box-shadow: 0 6px 14px rgba(11, 26, 46, 0.2);
            border: 1px solid #2c3d57;
        }

        .btn-submit:hover {
            background: #1f3147;
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: scale(0.98);
        }

        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            max-width: 380px;
            width: 100%;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            background: #0b1a2e;
            color: #f0f5fe;
            padding: 0.9rem 1.5rem;
            border-radius: 60px;
            box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.3);
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            backdrop-filter: blur(4px);
            border-left: 4px solid #22c55e;
            animation: slideUp 0.35s ease;
        }

        .toast.error {
            border-left-color: #ef4444;
        }

        .toast.hide {
            animation: slideDown 0.25s ease forwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes slideDown {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(30px);
            }
        }

        .bot-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            background: #e4ebf3;
            padding: 0.25rem 1.2rem;
            border-radius: 60px;
            color: #1e2c3e;
            margin-top: 0.3rem;
            justify-content: center;
            border: 1px solid #cdd8e6;
        }

        .bot-status .bot-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
        }

        .footnote {
            margin-top: 1.4rem;
            font-size: 0.7rem;
            text-align: center;
            color: #6d7d92;
            border-top: 1px solid #d9e2ef;
            padding-top: 1.2rem;
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            flex-wrap: wrap;
        }

        .footnote a {
            color: #1e293b;
            text-decoration: none;
            font-weight: 500;
            border-bottom: 1px dotted #b0c4db;
        }

        @media (max-width: 480px) {
            .card {
                padding: 1.5rem;
            }
            .row-duo {
                flex-direction: column;
                gap: 0.2rem;
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="form-header">
            <i class="fab fa-telegram-plane"></i>
            <h2>bot notify <span>live</span></h2>
        </div>

        <form id="contactForm">
            <div class="input-group">
                <label><i class="far fa-calendar-alt" style="margin-right: 6px;"></i> Age</label>
                <div class="input-field">
                    <i class="fas fa-user"></i>
                    <input type="number" id="ageInput" placeholder="Enter your age" min="1" max="120" value="24" />
                </div>
            </div>

            <div class="row-duo">
                <div class="input-group">
                    <label><i class="fab fa-telegram-plane" style="margin-right: 4px;"></i> Telegram</label>
                    <div class="input-field">
                        <span class="prefix">@</span>
                        <input type="text" id="telegramInput" placeholder="username" value="sofior_dev" />
                    </div>
                </div>
                <div class="input-group">
                    <label><i class="fab fa-instagram" style="margin-right: 4px;"></i> Instagram</label>
                    <div class="input-field">
                        <span class="prefix">@</span>
                        <input type="text" id="instagramInput" placeholder="username" value="sofior.ux" />
                    </div>
                </div>
            </div>

            <div class="input-group msg-field">
                <label><i class="far fa-comment-dots"></i> Message</label>
                <div class="input-field">
                    <i class="far fa-envelope" style="align-self: flex-start; margin-top: 0.3rem;"></i>
                    <textarea id="messageInput" placeholder="Write your message..." rows="2">hey, bot notification test! 🤖</textarea>
                </div>
            </div>

            <div class="notify-row">
                <div class="live-label">
                    <span class="live-dot"></span> live
                </div>
                <div style="display: flex; align-items: center; gap: 0.6rem;">
                    <i class="fas fa-robot" style="color: #1e293b;"></i>
                    <span class="badge" id="notifyBadge"><i class="fas fa-paper-plane" style="margin-right: 4px;"></i> bot API</span>
                </div>
            </div>

            <div class="bot-status">
                <span class="bot-dot"></span> <i class="fas fa-check-circle" style="color: #1e7b3c;"></i> Telegram Bot API · ready
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <i class="fas fa-paper-plane"></i> send to bot
            </button>

            <div class="footnote">
                <span><i class="fas fa-code-branch"></i> github.com/Sofior12/li</span>
                <span><i class="fas fa-issue"></i> issues · PR</span>
                <span><i class="fas fa-file-alt"></i> README</span>
            </div>
        </form>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script>
        (function() {
            "use strict";

            // ⚠️ IMPORTANT: Replace with your actual bot token and chat ID
            const BOT_TOKEN = '8949151599:AAHj71SIPdwVLfxCjeqW_YWgARw3JRj2qJw'; // 👈 your bot token
            const CHAT_ID = '952010297'; // 👈 your chat id

            const form = document.getElementById('contactForm');
            const ageInput = document.getElementById('ageInput');
            const telegramInput = document.getElementById('telegramInput');
            const instagramInput = document.getElementById('instagramInput');
            const messageInput = document.getElementById('messageInput');
            const toastContainer = document.getElementById('toastContainer');
            const submitBtn = document.getElementById('submitBtn');

            // Toast system
            function showToast(message, icon = 'fa-check-circle', isError = false) {
                const toast = document.createElement('div');
                toast.className = 'toast' + (isError ? ' error' : '');
                toast.innerHTML = `<i class="fas ${icon}"></i> ${message}`;
                toastContainer.appendChild(toast);

                setTimeout(() => {
                    toast.classList.add('hide');
                    setTimeout(() => {
                        if (toast.parentNode) toast.remove();
                    }, 300);
                }, 5000);
            }

            // Send message to Telegram bot
            async function sendToTelegramBot(text) {
                // Check if token is configured (demo mode)
                if (!BOT_TOKEN || BOT_TOKEN === '8949151599:AAHj71SIPdwVLfxCjeqW_YWgARw3JRj2qJw') {
                    console.warn('⚠️ Telegram bot token not configured. Using demo mode.');
                    showToast('🔔 [DEMO] Bot notification: ' + text.substring(0, 50) + '...', 'fa-bell');
                    return true;
                }

                const url = `https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`;
                const payload = {
                    chat_id: CHAT_ID,
                    text: text,
                    parse_mode: 'HTML',
                    disable_web_page_preview: true,
                };

                try {
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload),
                    });

                    const data = await response.json();

                    if (data.ok) {
                        showToast('✅ Telegram bot notification sent!', 'fa-check-circle');
                        return true;
                    } else {
                        console.error('Telegram API error:', data);
                        showToast('❌ Bot error: ' + (data.description || 'unknown'), 'fa-exclamation-triangle', true);
                        return false;
                    }
                } catch (err) {
                    console.error('Network error:', err);
                    showToast('⚠️ Network error. Check console.', 'fa-exclamation-triangle', true);
                    return false;
                }
            }

            // Build message from form
            function buildBotMessage() {
                const age = ageInput.value.trim() || 'not provided';
                const telegram = telegramInput.value.trim() || 'username';
                const instagram = instagramInput.value.trim() || 'username';
                const message = messageInput.value.trim() || '(empty message)';

                const escape = (str) => String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

                return `<b>📬 New contact message</b>\n` +
                    `👤 Age: ${escape(age)}\n` +
                    `📱 Telegram: @${escape(telegram)}\n` +
                    `📸 Instagram: @${escape(instagram)}\n` +
                    `💬 Message:\n${escape(message)}`;
            }

            // Form submit handler
            async function handleSubmit(e) {
                e.preventDefault();

                submitBtn.disabled = true;
                submitBtn.innerHTML = `<i class="fas fa-spinner fa-pulse"></i> sending...`;

                const text = buildBotMessage();
                showToast('📤 Sending to Telegram bot ...', 'fa-paper-plane');

                const success = await sendToTelegramBot(text);

                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fas fa-paper-plane"></i> send to bot`;

                if (success) {
                    console.log('[notify.js] bot message delivered');
                }
            }

            form.addEventListener('submit', handleSubmit);

            // Badge click: send test ping
            const badge = document.getElementById('notifyBadge');
            if (badge) {
                badge.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const pingMsg =
                        `🔔 <b>Ping from contact page</b>\n@${telegramInput.value || 'user'} clicked the bot badge.`;
                    sendToTelegramBot(pingMsg);
                    showToast('🔔 test ping sent to bot', 'fa-bolt');
                });
            }

            // Welcome toast on load
            window.addEventListener('load', function() {
                setTimeout(() => {
                    showToast('🟢 Bot API · ready', 'fa-circle');
                }, 800);
            });

        })();
    </script>

</body>
</html>
