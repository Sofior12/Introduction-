<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>✨ Secret Message · Colorful</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>

    <!-- Animated Background -->
    <div class="bg-container">
        <div class="gradient-orb orb1"></div>
        <div class="gradient-orb orb2"></div>
        <div class="gradient-orb orb3"></div>
        <div class="gradient-orb orb4"></div>
    </div>

    <div class="container">
        <div class="card">

            <!-- Header -->
            <div class="header">
                <div class="icon-wrapper">
                    <i class="fas fa-comment-dots"></i>
                </div>
                <h1>Secret <span>Message</span></h1>
                <p class="step-info">Step <span id="stepDisplay" class="highlight">1</span> of <span id="totalSteps">4</span></p>
            </div>

            <!-- Progress Bar -->
            <div class="progress-container">
                <div class="progress-track">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
                <div class="steps-indicator">
                    <div class="step-dot active" data-step="1">
                        <span class="dot-num">1</span>
                        <span class="dot-label">Name</span>
                    </div>
                    <div class="step-dot" data-step="2">
                        <span class="dot-num">2</span>
                        <span class="dot-label">Age</span>
                    </div>
                    <div class="step-dot" data-step="3">
                        <span class="dot-num">3</span>
                        <span class="dot-label">City</span>
                    </div>
                    <div class="step-dot" data-step="4">
                        <span class="dot-num">4</span>
                        <span class="dot-label">Message</span>
                    </div>
                </div>
            </div>

            <!-- Form -->
            <form id="messageForm">

                <!-- Step 1: Name -->
                <div class="step active" data-step="1">
                    <div class="step-icon"><i class="fas fa-user-astronaut"></i></div>
                    <h2>What's your name?</h2>
                    <p class="step-desc">Don't worry, it's completely anonymous ✨</p>
                    <div class="input-group">
                        <div class="input-field">
                            <i class="fas fa-user"></i>
                            <input type="text" id="nameInput" placeholder="Enter your name..." required />
                        </div>
                    </div>
                    <button type="button" class="btn-next" onclick="nextStep()">
                        Next Step <i class="fas fa-arrow-right"></i>
                    </button>
                </div>

                <!-- Step 2: Age -->
                <div class="step" data-step="2">
                    <div class="step-icon"><i class="fas fa-cake-candles"></i></div>
                    <h2>How old are you?</h2>
                    <p class="step-desc">Just for fun 🎉</p>
                    <div class="input-group">
                        <div class="input-field">
                            <i class="fas fa-calendar-alt"></i>
                            <input type="number" id="ageInput" placeholder="Enter your age..." min="1" max="120" />
                        </div>
                    </div>
                    <div class="btn-group">
                        <button type="button" class="btn-prev" onclick="prevStep()">
                            <i class="fas fa-arrow-left"></i> Back
                        </button>
                        <button type="button" class="btn-next" onclick="nextStep()">
                            Next Step <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                </div>

                <!-- Step 3: City -->
                <div class="step" data-step="3">
                    <div class="step-icon"><i class="fas fa-globe-asia"></i></div>
                    <h2>Where are you from?</h2>
                    <p class="step-desc">Tell us your city or country 🌍</p>
                    <div class="input-group">
                        <div class="input-field">
                            <i class="fas fa-map-marker-alt"></i>
                            <input type="text" id="cityInput" placeholder="Enter your city..." />
                        </div>
                    </div>
                    <div class="btn-group">
                        <button type="button" class="btn-prev" onclick="prevStep()">
                            <i class="fas fa-arrow-left"></i> Back
                        </button>
                        <button type="button" class="btn-next" onclick="nextStep()">
                            Next Step <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                </div>

                <!-- Step 4: Message -->
                <div class="step" data-step="4">
                    <div class="step-icon"><i class="fas fa-feather-pointed"></i></div>
                    <h2>Your secret message</h2>
                    <p class="step-desc">Say anything you want 💌</p>
                    <div class="input-group">
                        <div class="input-field textarea-field">
                            <i class="fas fa-pencil-alt"></i>
                            <textarea id="messageInput" placeholder="Write your message here..." rows="4" required></textarea>
                        </div>
                    </div>
                    <div class="btn-group">
                        <button type="button" class="btn-prev" onclick="prevStep()">
                            <i class="fas fa-arrow-left"></i> Back
                        </button>
                        <button type="submit" class="btn-submit" id="submitBtn">
                            <i class="fas fa-paper-plane"></i> Send Message
                        </button>
                    </div>
                </div>

            </form>

            <!-- Footer -->
            <div class="footer">
                <span><i class="fas fa-shield-halved"></i> Anonymous</span>
                <span><i class="fas fa-bolt"></i> Instant</span>
                <span><i class="fas fa-lock"></i> Secure</span>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
