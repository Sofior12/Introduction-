<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🐍 Name · Step 1</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>

    <div class="bg-glow">
        <div class="orb o1"></div>
        <div class="orb o2"></div>
        <div class="orb o3"></div>
    </div>

    <div class="container">
        <div class="card">

            <!-- Header -->
            <div class="header">
                <div class="logo">
                    <i class="fas fa-comment-dots"></i>
                    <span>Secret<span>Message</span></span>
                </div>
                <div class="step-badge">1 / 5</div>
            </div>

            <!-- Progress -->
            <div class="progress">
                <div class="progress-track">
                    <div class="progress-fill" style="width:20%"></div>
                </div>
                <div class="steps">
                    <span class="active">Name</span>
                    <span>Age</span>
                    <span>City</span>
                    <span>IG</span>
                    <span>Message</span>
                </div>
            </div>

            <!-- Content -->
            <div class="content">
                <div class="icon"><i class="fas fa-user-astronaut"></i></div>
                <h1>What's your <span>name</span>?</h1>
                <p>✨ Completely anonymous · no one will know</p>

                <div class="input-wrap">
                    <div class="input">
                        <i class="fas fa-user"></i>
                        <input type="text" id="nameInput" placeholder="Enter your name..." />
                    </div>
                </div>

                <button class="btn primary" onclick="nextPage()">
                    Continue <i class="fas fa-arrow-right"></i>
                </button>
            </div>

            <!-- Footer -->
            <div class="footer">
                <span><i class="fas fa-shield-alt"></i> 256-bit</span>
                <span><i class="fas fa-bolt"></i> 0.2ms</span>
                <span><i class="fas fa-lock"></i> Encrypted</span>
            </div>

        </div>
        <div class="domain">secret-message.vercel.app · 2026</div>
    </div>

    <script>
        function nextPage() {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) {
                alert('Please enter your name');
                return;
            }
            sessionStorage.setItem('userName', name);
            window.location.href = 'age.html';
        }

        // Enter key support
        document.getElementById('nameInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') nextPage();
        });
    </script>
</body>
</html>
