<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🐍 Age · Step 2</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>

    <div class="bg-glow">
        <div class="orb o1"></div>
        <div class="orb o2"></div>
        <div class="orb o3"></div>
    </div>

    <div class="container">
        <div class="card">

            <div class="header">
                <div class="logo">
                    <i class="fas fa-comment-dots"></i>
                    <span>Secret<span>Message</span></span>
                </div>
                <div class="step-badge">2 / 5</div>
            </div>

            <div class="progress">
                <div class="progress-track">
                    <div class="progress-fill" style="width:40%"></div>
                </div>
                <div class="steps">
                    <span class="done">Name</span>
                    <span class="active">Age</span>
                    <span>City</span>
                    <span>IG</span>
                    <span>Message</span>
                </div>
            </div>

            <div class="content">
                <div class="icon"><i class="fas fa-cake-candles"></i></div>
                <h1>How old are <span>you</span>?</h1>
                <p>🎉 Just for fun · be honest</p>

                <div class="input-wrap">
                    <div class="input">
                        <i class="fas fa-calendar-alt"></i>
                        <input type="number" id="ageInput" placeholder="Enter your age..." min="1" max="120" />
                    </div>
                </div>

                <div class="btn-group">
                    <a href="index.html" class="btn secondary"><i class="fas fa-arrow-left"></i> Back</a>
                    <button class="btn primary" onclick="nextPage()">Continue <i class="fas fa-arrow-right"></i></button>
                </div>
            </div>

            <div class="footer">
                <span><i class="fas fa-shield-alt"></i> 256-bit</span>
                <span><i class="fas fa-bolt"></i> 0.2ms</span>
                <span><i class="fas fa-lock"></i> Encrypted</span>
            </div>

        </div>
        <div class="domain">secret-message.vercel.app · 2026</div>
    </div>

    <script>
        function nextPage() {
            const age = document.getElementById('ageInput').value.trim();
            sessionStorage.setItem('userAge', age || 'Not specified');
            window.location.href = 'city.html';
        }

        document.getElementById('ageInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') nextPage();
        });
    </script>
</body>
</html>
