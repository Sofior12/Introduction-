<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Age Check</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="message-container">
            <h2>🎂 Age Verification</h2>
            <p class="sub">Verify your age to access secret content</p>

            <form id="ageForm">
                <div class="form-group">
                    <label>Enter your age</label>
                    <input type="number" id="ageInput" placeholder="e.g. 21" min="1" max="120" required>
                </div>
                <button type="submit" class="btn" style="width:100%;">Check Age ✅</button>
            </form>

            <div id="ageResult" style="display:none;margin-top:24px;">
                <div class="age-display" id="ageDisplay">0</div>
                <div class="age-status" id="ageStatus">Checking...</div>
            </div>

            <a href="index.html" class="back-link" style="display:block;text-align:center;margin-top:20px;">← Back to Home</a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
