<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Send Secret Message</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="message-container">
            <h2>📨 Secret Message</h2>
            <p class="sub">Share anonymously · Colorful 2026</p>

            <form id="secretForm">
                <div class="form-group">
                    <label>Your Name (optional)</label>
                    <input type="text" id="senderName" placeholder="Anonymous" maxlength="30">
                </div>

                <div class="form-group">
                    <label>🔮 Your Secret Message</label>
                    <textarea id="secretMessage" placeholder="Write your secret here..." required></textarea>
                </div>

                <div class="form-group">
                    <label>🎨 Message Color</label>
                    <input type="color" id="msgColor" value="#ffd700">
                </div>

                <button type="submit" class="btn" style="width:100%;">Send Secret ✨</button>
            </form>

            <div class="message-output" id="messageOutput">
                <div class="secret" id="secretText">"Your secret message"</div>
                <p style="text-align:center;color:#a8a6d6;margin-top:8px;" id="senderDisplay">— Anonymous</p>
            </div>

            <a href="index.html" class="back-link">← Back to Home</a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
