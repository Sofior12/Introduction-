<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2026 · City</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet" />
</head>
<body>

    <div class="bg-2026">
        <div class="mesh-gradient"></div>
        <div class="particle-field">
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span>
        </div>
        <div class="orb-2026 o1"></div>
        <div class="orb-2026 o2"></div>
        <div class="orb-2026 o3"></div>
        <div class="orb-2026 o4"></div>
        <div class="orb-2026 o5"></div>
    </div>

    <div class="container-2026">
        <div class="card-2026 glass-2026">

            <div class="status-2026">
                <div class="status-left">
                    <div class="live-indicator">
                        <span class="live-dot"></span>
                        <span>Live</span>
                    </div>
                    <span class="status-divider">|</span>
                    <span class="status-step">Step 3/5</span>
                </div>
                <div class="status-right">
                    <span class="badge-2026"><i class="fas fa-shield-check"></i> Secure</span>
                    <span class="badge-2026 purple"><i class="fas fa-bolt"></i> 2026</span>
                </div>
            </div>

            <div class="header-2026">
                <div class="logo-2026">
                    <div class="logo-icon">
                        <i class="fas fa-comment-dots"></i>
                    </div>
                    <div>
                        <span class="logo-text">Secret<span class="highlight">Message</span></span>
                        <span class="logo-sub">anonymous · encrypted</span>
                    </div>
                </div>
                <div class="step-ring">
                    <svg width="44" height="44" viewBox="0 0 44 44">
                        <circle cx="22" cy="22" r="18" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="3"/>
                        <circle cx="22" cy="22" r="18" fill="none" stroke="url(#grad)" stroke-width="3" 
                            stroke-dasharray="113" stroke-dashoffset="45"/>
                        <defs>
                            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#7c3aed"/>
                                <stop offset="50%" stop-color="#ec4899"/>
                                <stop offset="100%" stop-color="#f59e0b"/>
                            </linearGradient>
                        </defs>
                    </svg>
                    <span class="step-num-2026">3</span>
                </div>
            </div>

            <div class="progress-2026">
                <div class="progress-track-2026">
                    <div class="progress-fill-2026" style="width:60%"></div>
                    <div class="progress-glow"></div>
                </div>
                <div class="step-dots-2026">
                    <div class="dot-item done" data-step="1">
                        <span class="dot-circle"><i class="fas fa-user"></i></span>
                        <span class="dot-label">Name</span>
                    </div>
                    <div class="dot-item done" data-step="2">
                        <span class="dot-circle"><i class="fas fa-cake"></i></span>
                        <span class="dot-label">Age</span>
                    </div>
                    <div class="dot-item active" data-step="3">
                        <span class="dot-circle"><i class="fas fa-map-pin"></i></span>
                        <span class="dot-label">City</span>
                    </div>
                    <div class="dot-item" data-step="4">
                        <span class="dot-circle"><i class="fab fa-instagram"></i></span>
                        <span class="dot-label">Instagram</span>
                    </div>
                    <div class="dot-item" data-step="5">
                        <span class="dot-circle"><i class="fas fa-feather"></i></span>
                        <span class="dot-label">Message</span>
                    </div>
                </div>
            </div>

            <form id="cityForm" class="form-2026">
                <div class="step-2026 active" data-step="3">
                    <div class="step-content-2026">
                        <div class="step-icon-2026">
                            <div class="icon-orb">
                                <i class="fas fa-globe-asia"></i>
                            </div>
                        </div>
                        <h2>Where are you <span>from</span>?</h2>
                        <p class="step-desc-2026">🌍 Tell us your city or country</p>
                        <div class="input-2026">
                            <div class="input-wrapper-2026">
                                <i class="fas fa-map-marker-alt"></i>
                                <input type="text" id="cityInput" placeholder="Enter your city..." />
                                <div class="input-glow"></div>
                            </div>
                        </div>
                        <div class="btn-group-2026">
                            <a href="age.html" class="btn-2026 secondary">
                                <i class="fas fa-arrow-left"></i> Back
                            </a>
                            <button type="submit" class="btn-2026 primary">
                                Continue <i class="fas fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </form>

            <div class="footer-2026">
                <div class="footer-left-2026">
                    <span><i class="fas fa-shield-halved"></i> 256-bit</span>
                    <span><i class="fas fa-bolt"></i> 0.2ms</span>
                    <span><i class="fas fa-lock"></i> Encrypted</span>
                </div>
                <div class="footer-right-2026">
                    <span class="vercel-2026">
                        <i class="fas fa-check-circle"></i> v2.0.0
                    </span>
                </div>
            </div>
        </div>

        <div class="domain-2026">
            <i class="fas fa-globe"></i>
            <span>secret-message.vercel.app</span>
            <span class="dot-2026">•</span>
            <span class="source-2026">main · 2026</span>
        </div>
    </div>

    <div id="toastContainer" class="toast-2026-container"></div>

    <script>
        document.getElementById('cityForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const city = document.getElementById('cityInput').value.trim();
            sessionStorage.setItem('userCity', city || 'Not specified');
            window.location.href = 'instagram.html';
        });
    </script>
</body>
</html>
