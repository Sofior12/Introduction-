<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Selector</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="message-container">
            <h2>🌆 City Secrets</h2>
            <p class="sub">Pick a city to reveal a secret message</p>

            <div class="city-grid">
                <button class="city-btn" data-city="newyork">🗽 New York</button>
                <button class="city-btn" data-city="london">🎩 London</button>
                <button class="city-btn" data-city="tokyo">🌸 Tokyo</button>
                <button class="city-btn" data-city="paris">🥖 Paris</button>
                <button class="city-btn" data-city="dubai">🏙️ Dubai</button>
                <button class="city-btn" data-city="mumbai">🌊 Mumbai</button>
                <button class="city-btn" data-city="berlin">🎨 Berlin</button>
                <button class="city-btn" data-city="sydney">🏄 Sydney</button>
            </div>

            <div class="city-message" id="cityMessage">
                🌍 Select a city above
            </div>

            <a href="index.html" class="back-link" style="display:block;text-align:center;margin-top:20px;">← Back to Home</a>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
